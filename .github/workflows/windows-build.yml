name: Windows development build

on:
  push:
    branches:
      - feat/windows-public-room
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 development single EXE
    if: github.repository == 'Sparrow2333/BongoCat'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install the target for the repository toolchain
        run: rustup target add x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@just
      - name: Restore Rust build cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-development-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-development-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - name: Test standalone resources and update boundaries
        run: cargo test --locked -p bongocat-app --features standalone
      - name: Build the development single EXE
        run: just build --environment development --target x86_64-pc-windows-msvc --standalone
      - name: Verify the single EXE away from the repository
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -Path target/package -Filter 'BongoCat_*_standalone.exe' -File)
          if ($executables.Count -ne 1) {
            throw "Expected one standalone EXE, found $($executables.Count)"
          }
          if ($executables[0].Length -eq 0) { throw 'The executable is empty' }
          Get-FileHash -LiteralPath $executables[0].FullName -Algorithm SHA256
          $smokeDirectory = Join-Path $env:RUNNER_TEMP 'BongoCat single EXE smoke'
          New-Item -ItemType Directory -Path $smokeDirectory -Force | Out-Null
          $smokeExe = Join-Path $smokeDirectory 'BongoCat.exe'
          Copy-Item -LiteralPath $executables[0].FullName -Destination $smokeExe
          $process = Start-Process -FilePath $smokeExe -ArgumentList '--embedded-presets-smoke' -WorkingDirectory $smokeDirectory -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Embedded preset verification timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Embedded preset verification failed: $($process.ExitCode)" }
          if (@(Get-ChildItem -LiteralPath $smokeDirectory).Count -ne 1) {
            throw 'Standalone smoke wrote files next to the EXE'
          }
      - name: Upload the single EXE
        id: executable
        uses: actions/upload-artifact@v7
        with:
          name: BongoCat-Windows-x64-development
          path: target/package/BongoCat_*_standalone.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Show the download link
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.executable.outputs.artifact-url }}
        run: |
          "[Download the Windows x64 development single EXE]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
          'Extract the downloaded artifact and run its single EXE on Windows; no installer or sidecar model folder is needed. Development application data is separate from the production version. Replace the EXE manually to update.' >> $env:GITHUB_STEP_SUMMARY
      - name: Save Rust build cache
        if: always() && !cancelled() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
